name: Build Dylib

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          mkdir -p build
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework UIKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            -dynamiclib \
            -o build/LichessAssistant.dylib \
            Tweak.m FloatingButton.m ArrowOverlay.m SettingsUI.m EngineBridge.m FENScanner.m
          ls -lh build/LichessAssistant.dylib

      - name: Package
        run: |
          mkdir -p Payload
          cp build/LichessAssistant.dylib Payload/
          zip -r LichessAssistant.dylib.zip Payload/LichessAssistant.dylib
          ls -lh LichessAssistant.dylib.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichessAssistant-dylib
          path: LichessAssistant.dylib.zip
          retention-days: 7
